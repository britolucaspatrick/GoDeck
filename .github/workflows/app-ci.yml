name: Flutter App CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'

jobs:
  test-and-build:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze Code
        run: |
          cd app
          flutter analyze

      - name: Run Tests
        run: |
          cd app
          flutter test

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --debug
