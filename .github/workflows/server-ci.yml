name: Go Server CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  test-and-build:
    name: Go Test & Cross Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: server/go.sum

      - name: Install Dependencies
        run: |
          cd server
          go mod download

      - name: Run Tests
        run: |
          cd server
          go test -v ./...

      - name: Cross-Compile Server Binaries
        run: |
          cd server
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/godeck-mac-arm64 ./cmd/godeck
          GOOS=linux GOARCH=amd64 go build -o dist/godeck-linux-amd64 ./cmd/godeck
          GOOS=windows GOARCH=amd64 go build -o dist/godeck-windows-amd64.exe ./cmd/godeck
